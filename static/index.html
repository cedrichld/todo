<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="top">
  <nav id="tabs">
    <button data-view="all">All</button>
    <button data-view="today">Today</button>
    <button data-view="waiting">Waiting</button>
    <button data-view="done">Done</button>
    <button data-view="insights">Insights</button>
    <button data-view="history" class="quiet">History</button>
  </nav>
  <label id="search-wrap"><i class="ic"></i><input id="search" type="search" placeholder="Search" autocomplete="off"><kbd>Ctrl+K</kbd></label>
  <label id="hide-done-label"><input type="checkbox" id="hide-done"> Hide done</label>
  <button id="archive-done" title="Archive every done task (they stay in Done and History)">Archive done</button>
  <button id="help-btn" title="Keyboard shortcuts">?</button>
  <span id="status" class="saved" title="saved"></span>
  <button id="theme" title="Switch light / dark" aria-label="Switch light / dark"><svg viewBox="0 0 24 24" aria-hidden="true">
    <mask id="moon-mask"><rect width="24" height="24" fill="white"/><circle class="cut" cx="30" cy="4" r="7" fill="black"/></mask>
    <circle class="core" cx="12" cy="12" r="5" fill="currentColor" mask="url(#moon-mask)"/>
    <g class="rays" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none">
      <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
    </g>
  </svg></button>
</header>
<main id="view"></main>
<div id="popover" hidden></div>
<div id="toast"></div>
<div id="tip" hidden></div>
<script src="/insights.js"></script>
<script src="/app.js"></script>
</body>
</html>
